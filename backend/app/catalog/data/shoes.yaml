# -----------------------------------------------------------------------------
# OPEN ITEMS before this seed is production-ready
# -----------------------------------------------------------------------------
# 1. msrp_usd is null on all 28 rows. Populate from brand sites and record a
#    source URL per row. The section 7.6 budget gate cannot ship until this is
#    done — a null price must not be silently treated as "within budget".
# 2. shoe_size_map (W3-2) is empty. size_exists defaults TRUE, so the D9 hard
#    gate currently passes everything. Fine for the thin slice; not fine once
#    real users enter a street size.
# 3. Quadrant priors are single-rater judgements. W0-4a exists to test them
#    against independent raters — expect some to move, especially the boundary
#    shoes flagged in the notes (Instinct VSR, Iati, Oasi, Vapor Lace).
# 4. Counts by quadrant, computed from the priors (not from the section
#    headings, which group by intended use): Q1 8, Q2 6, Q3 8, Q4 8 = 30.
#    Q2 is thinnest — add trad/multi-pitch models first if the catalogue grows.
#    Do not hand-maintain these numbers; validate.py prints them.
# 5. Mechanically verified by validate.py: count inside the D6 band, YAML
#    parses, 71 aliases unique case-insensitively, no duplicate identity,
#    every prior inside [-1,1] and off-axis, enums match the SQL CHECK
#    constraints, and all five anchors land in their section-3 quadrants.
