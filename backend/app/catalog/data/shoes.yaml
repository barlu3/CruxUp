# [W5-1] Seed catalog — 30 shoes (D6 rescope: 25-30, was 50-100).
#
# Run `python3 backend/app/catalog/validate.py` after any edit. It enforces
# the D6 count band, the section-3 anchor placements, alias uniqueness, and
# prior ranges — all things that have already been got wrong by hand once.
#
# QUADRANT PRIORS (timeline.md section 3)
#   x: comfort (-1) .. performance (+1)
#   y: stiff   (-1) .. soft        (+1)
#   Q1 x>0,y<0 perf+stiff | Q2 x<0,y<0 comfort+stiff
#   Q3 x<0,y>0 comfort+soft | Q4 x>0,y>0 perf+soft
#
# In the thin slice (D7) these priors ARE the placement — there is no corpus
# yet. After W2-3 they become the sub-N_min fallback. They are deliberate
# judgement calls, not measurements, which is exactly what hand-placement
# means; W0-4a exists to check them against independent raters.
#
# DATA PROVENANCE — READ BEFORE USING
#   stated:     brand, model, closure, downturn, rubber, stiffness_spec,
#               last_shape — stable published characteristics of these models.
#   UNVERIFIED: msrp_usd is null on every row. Prices move, vary by region and
#               retailer, and feed the section 7.6 budget gate. Guessing them
#               would put fabricated numbers behind a user-facing filter.
#               Populate from brand sites before the budget gate ships;
#               tracked as open item 1 at the foot of this file.
#
# The five section-3 anchors are marked `anchor: true` and use the CORRECTED
# placements (v3): Solution Q1, TC Pro Q2, Drago Q4, Instinct VSR Q4,
# Defy Q3. Do not regress these.

