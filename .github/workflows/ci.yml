# CI for the CruxUp backend.
#
# Two jobs, because the suite runs in two modes on purpose:
#   * unit        -- no database. Proves the default suite stays hermetic: the
#                    DB-backed tests must SKIP cleanly, never fail, when no
#                    database is reachable.
#   * integration -- a real PostgreSQL 16. Applies the migration, proves it
#                    reverses and re-applies, seeds the catalogue, then runs the
#                    whole suite and FAILS if any test skipped -- a skip here
#                    means the database setup broke, not that it is optional.
#
# No frontend job yet: src/app/layout.tsx and page.tsx are empty and there is
# no lockfile, so the app cannot build. Adding that job is part of W6-0
# (timeline.md section 11). No deploy stage: there is no hosting target.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (no database, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented minimum (SETUP.md); 3.12 catches forward breakage.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate the catalogue
        run: python backend/app/catalog/validate.py

      - name: Run tests without a database
        env:
          # Port 1 never listens, so every DB-backed test takes its skip path.
          DATABASE_URL: postgresql://localhost:1/unreachable
        run: python -m pytest backend/tests/ -q -rs

  integration:
    name: Integration tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cruxup
          POSTGRES_PASSWORD: cruxup
          POSTGRES_DB: cruxup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cruxup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the ephemeral service container only.
      DATABASE_URL: postgresql://cruxup:cruxup@localhost:5432/cruxup
      MIGRATIONS: backend/app/db/migrations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # The migration was edited in place pre-release (CONTEXT/ARCHITECTURE
      # section 12), so prove the up/down pair still agree on every run.
      - name: Apply, reverse and re-apply the migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$MIGRATIONS/0001_init.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$MIGRATIONS/0001_init_down.sql"
          remaining=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from information_schema.tables where table_schema = 'public'")
          test "$remaining" -eq 0 || { echo "down migration left $remaining tables"; exit 1; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$MIGRATIONS/0001_init.sql"

      - name: Seed the catalogue
        run: python backend/app/catalog/seed.py

      - name: Run the full suite against the database
        run: |
          python -m pytest backend/tests/ -q -rs | tee pytest.log
          if grep -qE "[0-9]+ skipped" pytest.log; then
            echo "::error::Tests skipped with a database available -- the DB setup is broken."
            exit 1
          fi

      - name: Confirm tests left no survey rows behind
        run: |
          rows=$(psql "$DATABASE_URL" -tAc "select count(*) from user_survey")
          test "$rows" -eq 0 || { echo "::error::$rows user_survey rows left behind"; exit 1; }
